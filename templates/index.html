<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tutedude assignment</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 480px; margin: 60px auto; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 16px; padding: 10px 20px; }
        .error { color: #c0392b; margin-top: 16px; }
    </style>
</head>
<body>
    <h1>Submit Data</h1>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('submit') }}">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" value="{{ name or '' }}" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email or '' }}" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="4">{{ message or '' }}</textarea>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
