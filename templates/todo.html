<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 480px; margin: 60px auto; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button { margin-top: 16px; padding: 10px 20px; }
        .error { color: #c0392b; margin-top: 16px; }
        ul { padding-left: 20px; margin-top: 24px; }
        li { margin-bottom: 12px; }
        li strong { display: block; }
    </style>
</head>
<body>
    <h1>To-Do List</h1>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('add_todo') }}">
        <label for="item_name">Item Name</label>
        <input type="text" id="item_name" name="item_name" value="{{ item_name or '' }}" required>

        <label for="item_description">Item Description</label>
        <textarea id="item_description" name="item_description" rows="4">{{ item_description or '' }}</textarea>

        <label for="item_id">Item ID</label>
        <input type="text" id="item_id" name="item_id" value="{{ item_id or '' }}">

        <label for="item_uuid">Item UUID</label>
        <input type="text" id="item_uuid" name="item_uuid" value="{{ item_uuid or '' }}">

        <label for="item_hash">Item Hash</label>
        <input type="text" id="item_hash" name="item_hash" value="{{ item_hash or '' }}">

        <button type="submit">Add Item</button>
    </form>

    <ul>
        {% for item in items %}
        <li>
            <strong>{{ item.name }}</strong>
            {{ item.description }}
        </li>
        {% else %}
        <li>No items yet.</li>
        {% endfor %}
    </ul>

    <p><a href="{{ url_for('home') }}">Back to form</a></p>
</body>
</html>
